<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 620" role="img" aria-labelledby="t d"><title id="t">Three ways to control the box</title><desc id="d">The Xiaomi remote talks to the box over Bluetooth, with three buttons remapped. Home Assistant reaches the box two ways: over the network through the Android TV Remote service and ADB, which also reports what is playing, and through an M5Stack ATOM Echo ESP32 acting as a Bluetooth keyboard, which sends keys and text and can wake the box when the network routes have gone to sleep.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6a8a88"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0604c"/></marker></defs><rect width="480" height="620" rx="24" fill="#f5f8f7"/><rect x="140" y="24" width="200" height="64" rx="14" fill="#e8eef8" stroke="#8fa9d6" stroke-width="2.5"/><text x="240.0" y="52.65" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2a2a">Home Assistant</text><text x="240.0" y="74.65" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#566">dashboards, automations</text><path d="M200 90 L110 170" fill="none" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/><path d="M280 90 L370 170" fill="none" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/><rect x="20" y="172" width="200" height="110" rx="14" fill="#faf2de" stroke="#e6c277" stroke-width="2.5"/><text x="120.0" y="202.95" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2a2a">Android TV</text><text x="120.0" y="224.95" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#566">Remote + ADB</text><text x="120.0" y="244.95" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#566">over the network</text><text x="120.0" y="264.95" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#566">keys + what&#x27;s playing</text><rect x="260" y="172" width="200" height="110" rx="14" fill="#faf2de" stroke="#e6c277" stroke-width="2.5"/><text x="360.0" y="202.95" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2a2a">ATOM Echo</text><text x="360.0" y="224.95" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#566">Bluetooth keyboard</text><text x="360.0" y="244.95" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#566">keys + text</text><text x="360.0" y="264.95" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#566">wakes the box</text><path d="M120 284 L210 400" fill="none" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/><path d="M360 284 L270 400" fill="none" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/><rect x="90" y="402" width="300" height="76" rx="14" fill="#e6f4f1" stroke="#56b3a4" stroke-width="2.5"/><text x="240.0" y="437.0" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2a2a">Xiaomi TV Box S</text><text x="240.0" y="459.0" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#566">cleaned-up Google TV</text><path d="M410 560 L330 480" fill="none" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/><rect x="300" y="540" width="160" height="64" rx="14" fill="#eef1f1" stroke="#a9b8b7" stroke-width="2.5"/><text x="380.0" y="567.95" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2a2a">The remote</text><text x="380.0" y="589.95" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#566">Bluetooth</text><text x="150" y="560" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" font-weight="700" fill="#566">Kept on purpose:</text><text x="150" y="580" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#566">don&#x27;t disable</text><text x="150" y="598" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#566">tv.remote.service</text></svg>
