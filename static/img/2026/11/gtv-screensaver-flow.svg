<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" role="img" aria-labelledby="t d"><title id="t">How the screensaver decides what to show</title><desc id="d">After 3 minutes idle, Android starts the screensaver. It loads my immich-kiosk page in a full-screen WebView. If the page loads within 25 seconds, it shows my kids&#x27; photos with date, location and weather. If it times out or returns an HTTP error, it switches to Wikimedia Commons featured landscape and city photos, and checks the kiosk page again every 10 minutes, switching back once it is up.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6a8a88"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0604c"/></marker></defs><rect width="480" height="640" rx="24" fill="#f5f8f7"/><rect x="90" y="24" width="300" height="60" rx="14" fill="#eef1f1" stroke="#a9b8b7" stroke-width="2.5"/><text x="240.0" y="50.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2a2a">3 minutes idle</text><text x="240.0" y="72.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#566">Android starts the dream</text><line x1="240" y1="86" x2="240" y2="116" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/><rect x="60" y="118" width="360" height="66" rx="14" fill="#e8eef8" stroke="#8fa9d6" stroke-width="2.5"/><text x="240.0" y="147.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2a2a">Load immich-kiosk page</text><text x="240.0" y="169.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#566">full-screen WebView</text><line x1="240" y1="186" x2="240" y2="214" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/><path d="M240 216 L390 276 L240 336 L90 276 Z" fill="#faf2de" stroke="#e6c277" stroke-width="2.5"/><text x="240" y="272" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2a2a">Loaded in 25 s,</text><text x="240" y="292" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2a2a">no HTTP error?</text><text x="60" y="262" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a7a68">yes</text><text x="420" y="262" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" font-weight="700" fill="#b5543f">no</text><path d="M90 276 L50 276 L50 370" fill="none" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/><path d="M390 276 L430 276 L430 370" fill="none" stroke="#c0604c" stroke-width="3" marker-end="url(#r)"/><rect x="20" y="372" width="210" height="120" rx="14" fill="#e6f4f1" stroke="#56b3a4" stroke-width="2.5"/><text x="125.0" y="408.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2a2a">My kids&#x27; photos</text><text x="125.0" y="430.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#566">from Immich, with</text><text x="125.0" y="450.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#566">date, location</text><text x="125.0" y="470.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#566">and weather</text><rect x="250" y="372" width="210" height="120" rx="14" fill="#fbe9e6" stroke="#d98473" stroke-width="2.5"/><text x="355.0" y="408.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2a2a">Fallback photos</text><text x="355.0" y="430.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#566">Wikimedia Commons</text><text x="355.0" y="450.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#566">landscapes + cities</text><text x="355.0" y="470.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#566">new one every 20 s</text><path d="M355 494 L355 552" fill="none" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/><rect x="110" y="556" width="260" height="56" rx="14" fill="#faf2de" stroke="#e6c277" stroke-width="2.5"/><text x="240.0" y="580.1" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2a2a">Every 10 min: kiosk up?</text><text x="240.0" y="601.1" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#566">yes: switch back</text><path d="M110 584 L80 584 L80 494" fill="none" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/></svg>
