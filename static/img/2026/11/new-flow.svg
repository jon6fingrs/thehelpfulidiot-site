<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" role="img" aria-labelledby="t d"><title id="t">The new setup</title><desc id="d">I push to GitHub. GitHub Actions builds and deploys the two Zola sites, while Cloudflare watches the repo for the two plain HTML sites. Cloudflare Pages serves all four sites to visitors.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6a8a88"/></marker></defs><rect width="480" height="600" rx="24" fill="#f5f8f7"/><text x="240.0" y="40" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="20" font-weight="700" fill="#1a7a68">AFTER: nothing of mine in the path</text><rect x="90" y="60" width="300" height="56" rx="14" fill="#e8eef8" stroke="#8fa9d6" stroke-width="2.5"/><text x="240.0" y="85.0" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2a2a">git push</text><text x="240.0" y="108.0" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" fill="#566">to GitHub</text><line x1="150" y1="118" x2="125" y2="170" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/><line x1="330" y1="118" x2="355" y2="170" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/><rect x="24" y="172" width="214" height="110" rx="14" fill="#faf2de" stroke="#e6c277" stroke-width="2.5"/><text x="131.0" y="208" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2a2a">GitHub Actions</text><text x="131.0" y="236" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" fill="#566">build, test, deploy</text><text x="131.0" y="258" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" fill="#566">(blog, personal site)</text><rect x="242" y="172" width="214" height="110" rx="14" fill="#faf2de" stroke="#e6c277" stroke-width="2.5"/><text x="349.0" y="208" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2a2a">Cloudflare Git link</text><text x="349.0" y="236" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" fill="#566">watches a folder</text><text x="349.0" y="258" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" fill="#566">(2 calculators)</text><line x1="131" y1="284" x2="200" y2="350" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/><line x1="349" y1="284" x2="280" y2="350" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/><rect x="24" y="352" width="432" height="86" rx="14" fill="#e6f4f1" stroke="#56b3a4" stroke-width="2.5"/><text x="240.0" y="392.0" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2a2a">Cloudflare Pages</text><text x="240.0" y="415.0" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" fill="#566">4 projects: DNS, certificates, hosting</text><line x1="240.0" y1="440" x2="240.0" y2="500" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/><rect x="90" y="502" width="300" height="56" rx="14" fill="#e8eef8" stroke="#8fa9d6" stroke-width="2.5"/><text x="240.0" y="527.0" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2a2a">Visitor</text><text x="240.0" y="550.0" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" fill="#566">served from Cloudflare</text></svg>