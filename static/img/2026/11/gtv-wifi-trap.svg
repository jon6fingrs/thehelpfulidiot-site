<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 620" role="img" aria-labelledby="t d"><title id="t">The Wi-Fi ownership trap</title><desc id="d">On Google TV the setup wizard, setupwraith, can own your saved Wi-Fi network. Disabling it makes Android delete the networks it owns, so the TV drops off Wi-Fi and the ADB connection dies mid-job. The fix: forget and re-join the network on the TV so it is owned by the system, check again, then disable the wizard safely.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6a8a88"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0604c"/></marker></defs><rect width="480" height="620" rx="24" fill="#f5f8f7"/><text x="240.0" y="40" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="20" font-weight="700" fill="#b5543f">THE TRAP</text><rect x="40" y="60" width="400" height="70" rx="14" fill="#faf2de" stroke="#e6c277" stroke-width="2.5"/><text x="240.0" y="91.15" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2a2a">Saved Wi-Fi owned by setupwraith</text><text x="240.0" y="114.15" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" fill="#566">the Google TV setup wizard</text><line x1="240" y1="132" x2="240" y2="164" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="166" width="400" height="60" rx="14" fill="#eef1f1" stroke="#a9b8b7" stroke-width="2.5"/><text x="240.0" y="202.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2a2a">pm disable-user setupwraith</text><line x1="240" y1="228" x2="240" y2="260" stroke="#c0604c" stroke-width="3" marker-end="url(#r)"/><rect x="40" y="262" width="400" height="70" rx="14" fill="#fbe9e6" stroke="#d98473" stroke-width="2.5"/><text x="240.0" y="293.15" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2a2a">Android deletes its networks</text><text x="240.0" y="316.15" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" fill="#566">TV drops off Wi-Fi, ADB dies mid-job</text><text x="240.0" y="380" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="20" font-weight="700" fill="#1a7a68">THE FIX</text><rect x="40" y="400" width="400" height="60" rx="14" fill="#e8eef8" stroke="#8fa9d6" stroke-width="2.5"/><text x="240.0" y="436.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2a2a">Forget + re-join Wi-Fi on the TV</text><line x1="240" y1="462" x2="240" y2="490" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="492" width="190" height="76" rx="14" fill="#e6f4f1" stroke="#56b3a4" stroke-width="2.5"/><text x="135.0" y="525.45" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2a2a">Owner: system</text><text x="135.0" y="548.45" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" fill="#566">dumpsys wifi</text><line x1="232" y1="530" x2="248" y2="530" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/><rect x="250" y="492" width="190" height="76" rx="14" fill="#e6f4f1" stroke="#56b3a4" stroke-width="2.5"/><text x="345.0" y="525.45" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2a2a">Now disable it</text><text x="345.0" y="548.45" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" fill="#566">Wi-Fi stays up</text><text x="240" y="600" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#566">The agent checked who owned the Wi-Fi before touching anything</text></svg>
