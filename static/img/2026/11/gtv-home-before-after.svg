<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 700" role="img" aria-labelledby="t d"><title id="t">Before and after: the home screen</title><desc id="d">Before: the stock Google TV home screen, with a sponsored banner, rows of recommendations and Xiaomi&#x27;s promo tabs, with my own apps in one small row. After: the cleanyourtv launcher, with a clock, a dock of six apps (Jellyfin, Netflix, Disney+, Prime Video, Apple TV, YouTube) and a grid of my apps. Illustration, not a screenshot.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6a8a88"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0604c"/></marker></defs><rect width="480" height="700" rx="24" fill="#f5f8f7"/><text x="240.0" y="46" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" font-weight="700" fill="#b5543f">BEFORE: Google TV</text><rect x="30" y="60" width="420" height="250" rx="12" fill="#22292b"/><rect x="40" y="70" width="400" height="230" rx="6" fill="#30393b"/><rect x="200" y="310" width="80" height="10" rx="3" fill="#22292b"/><rect x="50" y="80" width="380" height="74" rx="6" fill="#7a5b8c"/><text x="66" y="110" text-anchor="start" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffe08a">SPONSORED</text><text x="66" y="134" text-anchor="start" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#f3eef6">Watch this new show you didn&#x27;t ask for</text><text x="56" y="176" text-anchor="start" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" font-weight="700" fill="#cfd8d7">Top picks for you</text><rect x="56" y="184" width="66" height="38" rx="4" fill="#58676a"/><rect x="130" y="184" width="66" height="38" rx="4" fill="#58676a"/><rect x="204" y="184" width="66" height="38" rx="4" fill="#58676a"/><rect x="278" y="184" width="66" height="38" rx="4" fill="#58676a"/><rect x="352" y="184" width="66" height="38" rx="4" fill="#58676a"/><text x="56" y="242" text-anchor="start" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" font-weight="700" fill="#cfd8d7">Xiaomi TV+  ·  Free channels  ·  Trending</text><rect x="56" y="250" width="66" height="30" rx="4" fill="#4a5759"/><rect x="130" y="250" width="66" height="30" rx="4" fill="#4a5759"/><rect x="204" y="250" width="66" height="30" rx="4" fill="#4a5759"/><rect x="278" y="250" width="66" height="30" rx="4" fill="#4a5759"/><rect x="352" y="250" width="66" height="30" rx="4" fill="#4a5759"/><text x="240" y="296" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="11" fill="#9aa8a7">(your own apps: one row, further down)</text><text x="240.0" y="376" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="19" font-weight="700" fill="#1a7a68">AFTER: cleanyourtv launcher</text><rect x="30" y="390" width="420" height="250" rx="12" fill="#22292b"/><rect x="40" y="400" width="400" height="230" rx="6" fill="#30393b"/><rect x="200" y="640" width="80" height="10" rx="3" fill="#22292b"/><text x="240" y="452" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="34" font-weight="700" fill="#f1f5f4">8:41</text><text x="240" y="474" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#b9c6c4">Tuesday, November 3</text><rect x="58" y="500" width="54" height="54" rx="12" fill="#6a4fc0"/><text x="85" y="572" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#e3ebea">Jellyfin</text><rect x="120" y="500" width="54" height="54" rx="12" fill="#c4262e"/><text x="147" y="572" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#e3ebea">Netflix</text><rect x="182" y="500" width="54" height="54" rx="12" fill="#1b3d8f"/><text x="209" y="572" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#e3ebea">Disney+</text><rect x="244" y="500" width="54" height="54" rx="12" fill="#1f8fbf"/><text x="271" y="572" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#e3ebea">Prime</text><rect x="306" y="500" width="54" height="54" rx="12" fill="#111"/><text x="333" y="572" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#e3ebea">Apple TV</text><rect x="368" y="500" width="54" height="54" rx="12" fill="#d23a2c"/><text x="395" y="572" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#e3ebea">YouTube</text><rect x="52" y="492" width="376" height="90" rx="16" fill="none" stroke="#6f8583" stroke-width="1.5"/><text x="240" y="612" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#b9c6c4">Six-app dock, then an app library. No rows, no ads.</text><text x="240" y="682" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#566">Illustration, not a screenshot</text></svg>
