<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 690" role="img" aria-labelledby="t d"><title id="t">The old setup</title><desc id="d">A visitor reaches Cloudflare DNS, which points at an Oracle VPS. A WireGuard tunnel carries traffic to my house, through OPNsense and Traefik, to nginx containers.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6a8a88"/></marker></defs><rect width="480" height="690" rx="24" fill="#f5f8f7"/><text x="240.0" y="40" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="20" font-weight="700" fill="#a63d33">BEFORE: every stop had to work</text><rect x="90" y="60" width="300" height="56" rx="14" fill="#e8eef8" stroke="#8fa9d6" stroke-width="2.5"/><text x="240.0" y="85.0" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2a2a">Visitor</text><text x="240.0" y="108.0" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" fill="#566">asks for the site</text><line x1="240.0" y1="118" x2="240.0" y2="150" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/><rect x="90" y="152" width="300" height="56" rx="14" fill="#e8eef8" stroke="#8fa9d6" stroke-width="2.5"/><text x="240.0" y="177.0" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2a2a">Cloudflare DNS</text><text x="240.0" y="200.0" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" fill="#566">points the name at Oracle</text><line x1="240.0" y1="210" x2="240.0" y2="242" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/><rect x="90" y="244" width="300" height="56" rx="14" fill="#faf2de" stroke="#e6c277" stroke-width="2.5"/><text x="240.0" y="269.0" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2a2a">Oracle VPS</text><text x="240.0" y="292.0" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" fill="#566">the one public IP address</text><line x1="240.0" y1="302" x2="240.0" y2="342" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/><text x="256.0" y="328.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" fill="#566">WireGuard tunnel</text><rect x="24" y="344" width="432" height="312" rx="20" fill="#fdeeeb" stroke="#e3a39c" stroke-width="2" stroke-dasharray="8 6"/><text x="44" y="372" text-anchor="start" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#a63d33">MY HOUSE</text><rect x="90" y="384" width="300" height="50" rx="14" fill="#fdeeeb" stroke="#e3a39c" stroke-width="2.5"/><text x="240.0" y="416.0" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2a2a">OPNsense</text><line x1="240.0" y1="436" x2="240.0" y2="476" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/><rect x="90" y="478" width="300" height="50" rx="14" fill="#fdeeeb" stroke="#e3a39c" stroke-width="2.5"/><text x="240.0" y="510.0" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2a2a">Traefik</text><line x1="240.0" y1="530" x2="240.0" y2="570" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/><rect x="60" y="572" width="360" height="64" rx="14" fill="#fdeeeb" stroke="#e3a39c" stroke-width="2.5"/><text x="240.0" y="601.0" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2a2a">nginx containers</text><text x="240.0" y="624.0" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" fill="#566">one set per site, rebuilt by hand</text></svg>