<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 752" role="img" aria-labelledby="t d"><title id="t">How the cleanup went, step by step</title><desc id="d">Eight stages: read-only inspection and backup; fixing Wi-Fi ownership; deciding what stays; disabling apps in three batches with a screenshot after each; building the launcher from source; sideloading Jellyfin with checksum and signature checks; swapping the launcher, which was the riskiest step; and finally the screensaver, remote buttons and Home Assistant.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6a8a88"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0604c"/></marker></defs><rect width="480" height="752" rx="24" fill="#f5f8f7"/><text x="240.0" y="40" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="20" font-weight="700" fill="#1a7a68">About two hours, start to finish</text><rect x="40" y="62" width="400" height="60" rx="14" fill="#e8eef8" stroke="#8fa9d6" stroke-width="2.5"/><text x="240.0" y="88.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2a2a">1. Look, don&#x27;t touch</text><text x="240.0" y="110.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#566">inventory + full backup</text><line x1="240" y1="123" x2="240" y2="144" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="146" width="400" height="60" rx="14" fill="#faf2de" stroke="#e6c277" stroke-width="2.5"/><text x="240.0" y="172.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2a2a">2. Fix the Wi-Fi trap</text><text x="240.0" y="194.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#566">network owned by system</text><line x1="240" y1="207" x2="240" y2="228" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="230" width="400" height="60" rx="14" fill="#faf2de" stroke="#e6c277" stroke-width="2.5"/><text x="240.0" y="256.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2a2a">3. Decide what stays</text><text x="240.0" y="278.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#566">agent asks, I answer</text><line x1="240" y1="291" x2="240" y2="312" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="314" width="400" height="60" rx="14" fill="#faf2de" stroke="#e6c277" stroke-width="2.5"/><text x="240.0" y="340.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2a2a">4. Disable in 3 batches</text><text x="240.0" y="362.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#566">screenshot after each</text><line x1="240" y1="375" x2="240" y2="396" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="398" width="400" height="60" rx="14" fill="#e8eef8" stroke="#8fa9d6" stroke-width="2.5"/><text x="240.0" y="424.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2a2a">5. Build launcher from source</text><text x="240.0" y="446.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#566">JDK + SDK, no root</text><line x1="240" y1="459" x2="240" y2="480" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="482" width="400" height="60" rx="14" fill="#e8eef8" stroke="#8fa9d6" stroke-width="2.5"/><text x="240.0" y="508.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2a2a">6. Sideload Jellyfin</text><text x="240.0" y="530.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#566">checksum + signer checked</text><line x1="240" y1="543" x2="240" y2="564" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="566" width="400" height="60" rx="14" fill="#fbe9e6" stroke="#d98473" stroke-width="2.5"/><text x="240.0" y="592.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2a2a">7. Swap the launcher</text><text x="240.0" y="614.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#566">new Home first, then reboot</text><line x1="240" y1="627" x2="240" y2="648" stroke="#6a8a88" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="650" width="400" height="60" rx="14" fill="#e6f4f1" stroke="#56b3a4" stroke-width="2.5"/><text x="240.0" y="676.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2a2a">8. Screensaver, remote, HA</text><text x="240.0" y="698.3" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" fill="#566">the fun part</text><text x="240" y="738" text-anchor="middle" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" fill="#566">Red = the step that could leave a black screen</text></svg>
