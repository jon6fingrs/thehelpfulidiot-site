# Builds the site and runs the checks on every push and pull request. A push
# to main that passes is then deployed to Cloudflare Pages (the deploy job);
# a red check never deploys. See README.md, "Cloudflare Pages".
#
# The GitHub Pages preview (preview.yml) is separate and unaffected.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  ZOLA_VERSION: "0.23.6"   # keep in step with preview.yml and the session hook

jobs:
  build:
    name: Build site and run checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar xz -C /usr/local/bin zola
          zola --version

      # SITE_BASE_URL (repository variable) overrides config.toml's base_url.
      # Set it to "/" while the site is only on *.pages.dev, so links stay on
      # that copy; delete it at cutover.
      - name: Build
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: zola build ${SITE_BASE_URL:+--base-url "$SITE_BASE_URL"}

      - name: Internal link check
        run: zola check --skip-external-links

      - name: Site checks
        run: python3 scripts/check-site.py public

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # WordPress rules vs nginx, and which paths static/_routes.json sends
      # to a Function.
      - name: Redirect and routing tests
        run: node --test tests/*.test.mjs

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: public/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare is set up
        id: gate
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets not set; skipping deploy (see README.md)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # Needed for functions/ and wrangler.toml; the site itself is the
      # exact build the checks ran against.
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          name: public
          path: public

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22

      # Creates the Pages project on the first run; a no-op after that.
      - name: Create Pages project if missing
        if: steps.gate.outputs.ready == 'true'
        run: npx --yes wrangler@4.156.0 pages project create thehelpfulidiot --production-branch main || true

      - name: Deploy
        if: steps.gate.outputs.ready == 'true'
        run: npx --yes wrangler@4.156.0 pages deploy --branch main --commit-hash "$GITHUB_SHA"
